name: Build and Release Latest llama.cpp GPU Builds

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "既存タグがあっても新しい日付サフィックス付きタグでリリースする"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.meta.outputs.latest_tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_exists: ${{ steps.meta.outputs.release_exists }}
      should_build: ${{ steps.meta.outputs.should_build }}
    steps:
      - name: Resolve latest llama.cpp tag and release status
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp.git \
            | awk -F'/' '{print $3}' \
            | grep -E '^b[0-9]+' \
            | sort -V \
            | tail -n1)

          [[ -n "${latest_tag}" ]] || { echo "Failed to resolve latest tag"; exit 1; }

          release_tag="llama-gpu-${latest_tag}"
          if [[ "${{ github.event.inputs.force_release }}" == "true" ]]; then
            release_tag="${release_tag}-$(date -u +%Y%m%d%H%M%S)"
          fi

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            release_exists="true"
          else
            release_exists="false"
          fi

          if [[ "${release_exists}" == "true" ]]; then
            should_build="false"
          else
            should_build="true"
          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

  build-matrix:
    if: needs.prepare.outputs.should_build == 'true'
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin to Ubuntu 22.04 so the resulting binary links against glibc 2.35,
          # which keeps it runnable on the RunPod CUDA 12.8 base images that
          # KasaneCore deploys onto (those images ship Ubuntu 22.04 / glibc 2.35).
          #
          # CMAKE_CUDA_ARCHITECTURES is an explicit list rather than `all-major`
          # because CUDA 12.8's `all-major` adds sm_120 (consumer Blackwell, e.g.
          # RTX 50-series), and llama.cpp's mmq-instance-mxfp4.cu emits
          # `mma.kind::mxf4` PTX that ptxas only accepts on sm_100a/sm_103a;
          # building for sm_120 fails with "Feature '.kind::mxf4' not supported
          # on .target 'sm_120'". The list below covers the GPUs RunPod actually
          # offers (V100/T4/A100/A30/A40/RTX 30xx/RTX 4090/L40/L4/H100/H200);
          # B200 (sm_100) and RTX 5090 (sm_120) fall back to PTX JIT from sm_90.
          - target: linux-cuda
            runs_on: ubuntu-22.04
            backend: cuda
            ext: tar.gz
            cmake_flags: -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CUDA_ARCHITECTURES=70;75;80;86;89;90" -DGGML_NATIVE=OFF
            artifact_prefix: llama-linux-cuda
            cuda_version: 12.8.1
          - target: linux-amd-vulkan
            runs_on: ubuntu-22.04
            backend: vulkan
            ext: tar.gz
            cmake_flags: -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_TESTS=OFF
            artifact_prefix: llama-linux-amd-vulkan
          - target: linux-rocm-r9700
            runs_on: ubuntu-22.04
            backend: rocm
            ext: tar.gz
            # GGML_CUDA_FA_ALL_QUANTS は、量子化した KV の組み合わせぶんだけ
            # FlashAttention のカーネルを作る。既定は OFF で、f16 と一部の
            # 組み合わせしか入らない。
            #
            # 実機で問題になった。ControlDeck は KV を q8_0/q4_0 で持っており、
            # そのカーネルが無いと llama.cpp は f16 へ変換して走る。
            #   ggml_cuda_flash_attn_ext_vec: no FlashAttention vector kernel
            #   compiled for K/V types q8_0-q4_0, converting K and V to f16
            #   instead (slow)
            # 変換ぶんで生成が 7% 落ち、KV が f16 になるぶん載る context も減る。
            # ビルド時間と成果物は増えるが、使う側の設定を制限するよりよい。
            cmake_flags: -DGGML_HIP=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGPU_TARGETS=gfx1201 "-DCMAKE_BUILD_RPATH=/opt/rocm/lib" "-DCMAKE_INSTALL_RPATH=/opt/rocm/lib" -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_TESTS=OFF
            artifact_prefix: llama-linux-rocm-r9700
            rocm_version: 10.0.0
            rocm_package: amdrocm-core-dev10.0-gfx1201
          - target: windows-vulkan
            runs_on: windows-latest
            backend: vulkan
            ext: zip
            cmake_flags: -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_OPENSSL=ON
            artifact_prefix: llama-windows-vulkan

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network

      # The previous humbletim/setup-vulkan-sdk@v1.2.1 action was failing because
      # `latest` version resolution is broken, and its component list lacked
      # glslc (needed by llama.cpp's vulkan-shaders-gen). Install the official
      # LunarG SDK directly so glslc/shaderc are guaranteed to be present.
      - name: Setup Vulkan SDK
        if: runner.os == 'Windows' && matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Invoke-RestMethod -Uri 'https://vulkan.lunarg.com/sdk/latest/windows.txt').Trim()
          Write-Host "Installing Vulkan SDK $version"
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          & $installerPath --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installer failed with exit code $LASTEXITCODE"
          }
          $sdkRoot = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$sdkRoot\Bin\glslc.exe")) {
            throw "Vulkan SDK installation did not produce glslc at $sdkRoot\Bin\glslc.exe"
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup Linux Vulkan SDK
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/linux.txt)"
          archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-${version}.tar.xz"
          echo "Installing Vulkan SDK ${version}"
          curl -fL "https://sdk.lunarg.com/sdk/download/${version}/linux/vulkansdk-linux-x86_64-${version}.tar.xz" -o "$archive"
          tar -xf "$archive" -C "$RUNNER_TEMP"
          sdk_root="$RUNNER_TEMP/${version}/x86_64"
          test -x "$sdk_root/bin/glslc"
          echo "VULKAN_SDK=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/bin" >> "$GITHUB_PATH"

      - name: Install Linux Vulkan dependencies
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - name: Install Linux ROCm dependencies
        if: runner.os == 'Linux' && matrix.backend == 'rocm'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates wget gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://stable.repo.amd.com/rocm/gpg/packages.gpg \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/amdrocm.gpg >/dev/null
          sudo tee /etc/apt/sources.list.d/amdrocm-stable.sources >/dev/null <<'EOF'
          X-Repo-Id: amdrocm-stable
          Types: deb
          URIs: https://stable.repo.amd.com/rocm/core/packages/ubuntu2204/
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/amdrocm.gpg
          Enabled: yes
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${{ matrix.rocm_package }}"

          test -x /opt/rocm/bin/hipcc
          test -x /opt/rocm/llvm/bin/clang++
          test -e /opt/rocm/lib/libhipblas.so.3
          /opt/rocm/bin/hipcc --version
          dpkg-query -W -f='${Package} ${Version}\n' "${{ matrix.rocm_package }}"

          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "HIP_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "HIPCXX=/opt/rocm/llvm/bin/clang++" >> "$GITHUB_ENV"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "/opt/rocm/llvm/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgRoot = 'C:\vcpkg'
          }

          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path $vcpkgExe)) {
            throw "vcpkg.exe was not found at $vcpkgRoot"
          }

          & $vcpkgExe install openssl:x64-windows

          $opensslBin = Join-Path $vcpkgRoot 'installed\x64-windows\bin'
          $sslDll = Join-Path $opensslBin 'libssl-3-x64.dll'
          $cryptoDll = Join-Path $opensslBin 'libcrypto-3-x64.dll'

          if (-not (Test-Path $sslDll)) {
            throw "Required OpenSSL DLL was not installed: $sslDll"
          }

          if (-not (Test-Path $cryptoDll)) {
            throw "Required OpenSSL DLL was not installed: $cryptoDll"
          }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clone latest llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.prepare.outputs.latest_tag }}" https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Build target (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S llama.cpp -B llama.cpp/build -G Ninja ${{ matrix.cmake_flags }}
          cmake --build llama.cpp/build --config Release

      - name: Build llama-server (Windows Vulkan)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $needsOpenSsl = $true

          cmake -S llama.cpp -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DOPENSSL_ROOT_DIR="$env:VCPKG_ROOT\installed\x64-windows" `
            ${{ matrix.cmake_flags }}

          Write-Host "=== CMakeCache relevant flags ==="
          Get-Content build/CMakeCache.txt | Select-String "LLAMA_OPENSSL|GGML_VULKAN|LLAMA_BUILD_SERVER|BUILD_SHARED_LIBS|CMAKE_TOOLCHAIN_FILE|VCPKG_TARGET_TRIPLET|OPENSSL_ROOT_DIR"

          cmake --build build --config Release --target llama-server --parallel

          Write-Host "Generated executables and DLLs:"
          Get-ChildItem -Path build -Recurse -Include "*.exe","*.dll" | Select-Object FullName

          $server = @(Get-ChildItem -Path build -Recurse -Filter "llama-server.exe")
          if ($server.Count -eq 0) {
            throw "llama-server.exe was not produced by the Windows Vulkan build"
          }

          Write-Host "Found llama-server.exe:"
          $server | Select-Object FullName
          Write-Host "needsOpenSsl=$needsOpenSsl"

      - name: Verify version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "llama.cpp/build/bin/llama-cli" ]]; then
            llama.cpp/build/bin/llama-cli --version | head -n1
          elif [[ -x "llama.cpp/build/bin/main" ]]; then
            llama.cpp/build/bin/main --version | head -n1
          else
            echo "No known binary found" >&2
            exit 1
          fi

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar -C llama.cpp/build -czf "${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}.tar.gz" .

      - name: Package artifact (Windows Vulkan)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $needsOpenSsl = $true
          $distRoot = 'dist'
          $packageName = 'llama-windows-vulkan-x64'
          $dist = Join-Path $distRoot $packageName
          $zip = Join-Path $distRoot "$packageName.zip"

          Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Write-Host "Generated executables and DLLs:"
          Get-ChildItem -Path build -Recurse -Include "*.exe","*.dll" | Select-Object FullName

          $server = Get-ChildItem -Path build -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) {
            throw "llama-server.exe was not produced by the Windows Vulkan build"
          }

          Write-Host "needsOpenSsl=$needsOpenSsl"

          $runtimeDir = $server.DirectoryName
          Write-Host "Runtime output directory: $runtimeDir"

          Copy-Item -Path "$runtimeDir/*.exe" -Destination $dist -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$runtimeDir/*.dll" -Destination $dist -Force -ErrorAction SilentlyContinue

          Get-ChildItem -Path build -Recurse -Filter "*.dll" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $dist -Force
          }

          $opensslBin = Join-Path $env:VCPKG_ROOT 'installed\x64-windows\bin'
          $sslDll = Join-Path $opensslBin 'libssl-3-x64.dll'
          $cryptoDll = Join-Path $opensslBin 'libcrypto-3-x64.dll'

          if (-not (Test-Path $sslDll)) {
            throw "Required OpenSSL DLL not found: $sslDll"
          }

          if (-not (Test-Path $cryptoDll)) {
            throw "Required OpenSSL DLL not found: $cryptoDll"
          }

          Copy-Item -Path $sslDll -Destination $dist -Force
          Copy-Item -Path $cryptoDll -Destination $dist -Force

          Copy-Item -Path "llama.cpp/README.md" -Destination "$dist/README-llama.cpp.md" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "llama.cpp/LICENSE" -Destination "$dist/LICENSE-llama.cpp" -Force -ErrorAction SilentlyContinue

          $vcpkgCopyright = Join-Path $env:VCPKG_ROOT 'installed\x64-windows\share\openssl\copyright'
          if (Test-Path $vcpkgCopyright) {
            Copy-Item -Path $vcpkgCopyright -Destination "$dist/LICENSE-OpenSSL.txt" -Force
          }

          $requiredFiles = @(
            'llama-server.exe',
            'libssl-3-x64.dll',
            'libcrypto-3-x64.dll'
          )

          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $dist $requiredFile
            if (-not (Test-Path $requiredPath)) {
              throw "Windows package is incomplete. Missing: $requiredFile"
            }
          }

          $files = Get-ChildItem -Path $dist -File | Sort-Object Name
          $manifest = [PSCustomObject]@{
            package = $packageName
            platform = 'windows-x64'
            backend = 'vulkan'
            openssl_dependency = $true
            required_openssl_dlls = @(
              'libssl-3-x64.dll',
              'libcrypto-3-x64.dll'
            )
            files = @(
              $files | ForEach-Object {
                [PSCustomObject]@{
                  name = $_.Name
                  size = $_.Length
                  sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
                }
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Out-File "$dist/manifest.json" -Encoding utf8

          if (-not (Test-Path "$dist/manifest.json")) {
            throw "Windows package is incomplete. Missing: manifest.json"
          }

          Write-Host "Packaged Windows Vulkan artifact contents:"
          Get-ChildItem -Path $dist | Select-Object Name, Length

          Compress-Archive -Path "$dist/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) {
            throw "zip was not created"
          }

          Write-Host "Created Windows Vulkan package:"
          Get-Item $zip | Select-Object FullName, Length

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}
          path: ${{ matrix.artifact_prefix }}-${{ needs.prepare.outputs.latest_tag }}.tar.gz
          if-no-files-found: error

      - name: Upload artifact (Windows Vulkan)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-vulkan-x64
          path: dist/llama-windows-vulkan-x64.zip
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build-matrix
    if: always() && needs.prepare.result == 'success' && (needs.build-matrix.result == 'success' || needs.build-matrix.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Skip because release already exists
        if: needs.prepare.outputs.should_build == 'false'
        shell: bash
        run: |
          echo "Release tag already exists: ${{ needs.prepare.outputs.release_tag }}"
          echo "Build and release are skipped."

      - name: Download all artifacts
        if: needs.prepare.outputs.should_build == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        if: needs.prepare.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: llama.cpp GPU builds ${{ needs.prepare.outputs.latest_tag }}
          body: |
            Automated GPU builds for latest llama.cpp tag.

            Targets:
            - Linux amd64 CUDA
            - Linux amd64 Vulkan for AMD GPUs
            - Linux amd64 ROCm for Radeon AI PRO R9700
            - Windows amd64 Vulkan

            Upstream tag: `${{ needs.prepare.outputs.latest_tag }}`
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
